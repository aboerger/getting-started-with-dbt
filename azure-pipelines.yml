# Azure DevOps CI for the Jaffle Shop dbt project.
#
# Every pull request builds and tests the whole project in its own Warehouse schema
# (ci_<build id>), publishes the dbt artifacts, and drops the schema again. A failing
# test returns a non-zero exit code, which fails the stage - nothing downstream runs.
#
# A second job assembles the Lakehouse bundle NB_dbt_Runner_Spark installs from
# (tools/publish_dbt_bundle.py --assemble-only): it runs the tool tests, vendors the dbt
# packages, resolves dbt-fabricspark against the Fabric runtime manifest and zips it -
# without uploading. It needs no Fabric credentials; a requirement that would replace a
# runtime package without an allow-listed reason fails here instead of in a Spark session.
#
# One-time setup (see docs/fabric-setup.md):
#   * Variable group "dbt-fabric" with: DBT_WAREHOUSE_HOST, DBT_FABRIC_WORKSPACE_ID,
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (mark the secret as secret).
#   * The service principal is a Contributor on the Fabric workspace.

trigger: none          # CI only - no build on push to main

pr:
  branches:
    include: [main]
  paths:
    include:
      - jaffle_shop/**
      - requirements/**
      - runner/**
      - tools/**
      - pytest.ini
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest   # Fabric endpoints are public; no self-hosted agent required

variables:
  - group: dbt-fabric
  - name: DBT_PROJECT_DIR
    value: $(Build.SourcesDirectory)/jaffle_shop

stages:
  - stage: build_and_test
    displayName: dbt build (isolated CI schema)
    jobs:
      - job: dbt
        steps:
          - task: UsePythonVersion@0
            displayName: Python 3.11
            inputs:
              versionSpec: "3.11"

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements/warehouse.txt
              dbt --version
            displayName: Install pinned dbt + adapter

          - script: dbt deps
            displayName: dbt deps
            workingDirectory: $(DBT_PROJECT_DIR)

          - script: dbt build --target ci
            displayName: dbt build --target ci  (schema ci_$(Build.BuildId))
            workingDirectory: $(DBT_PROJECT_DIR)
            env:
              DBT_WAREHOUSE_HOST: $(DBT_WAREHOUSE_HOST)
              DBT_FABRIC_WORKSPACE_ID: $(DBT_FABRIC_WORKSPACE_ID)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              BUILD_BUILDID: $(Build.BuildId)

          - task: PublishPipelineArtifact@1
            displayName: Publish dbt artifacts (manifest, run_results, compiled SQL)
            condition: always()
            inputs:
              targetPath: $(DBT_PROJECT_DIR)/target
              artifact: dbt-target-$(Build.BuildId)

          - script: dbt run-operation drop_schema_if_exists --args "{schema_name: ci_$(Build.BuildId)}" --target ci
            displayName: Drop CI schema
            condition: always()
            workingDirectory: $(DBT_PROJECT_DIR)
            env:
              DBT_WAREHOUSE_HOST: $(DBT_WAREHOUSE_HOST)
              DBT_FABRIC_WORKSPACE_ID: $(DBT_FABRIC_WORKSPACE_ID)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              BUILD_BUILDID: $(Build.BuildId)

      - job: bundle
        displayName: Assemble the Lakehouse bundle (no upload)
        steps:
          - task: UsePythonVersion@0
            displayName: Python 3.11
            inputs:
              versionSpec: "3.11"

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements/tools.txt
              dbt --version
            displayName: Install pinned dbt + adapter + publish tooling

          - script: python -m pytest
            displayName: Tool and runner unit tests (tools/tests, runner/tests)

          - script: python tools/publish_dbt_bundle.py --assemble-only --build-version $(Build.BuildId) --out $(Build.ArtifactStagingDirectory)/bundle
            displayName: Assemble jaffle_shop.zip against the Runtime 2.0 manifest

          - task: PublishPipelineArtifact@1
            displayName: Publish the assembled bundle (zip + deployment.json)
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/bundle
              artifact: lakehouse-bundle-$(Build.BuildId)
